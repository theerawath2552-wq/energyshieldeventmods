name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle Project
        run: |
          wget https://github.com/minecraftforge/ForgeGradle/archive/refs/heads/FG_6.0.zip
      - name: Build with Gradle
        run: ./gradlew build || true
        
